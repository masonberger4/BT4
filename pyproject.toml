[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bt4"
description = "Constrained, multi-objective protein to mRNA back-translation optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BT4 authors" }]
keywords = ["bioinformatics", "codon-optimization", "back-translation", "mRNA", "CAI"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = []  # the pure core is stdlib-only; heavy deps live behind extras

[project.optional-dependencies]
# Each heavy dependency is opt-in; `import bt4` must stay lightweight.
ilp = ["ortools>=9.10"]
fold = ["ViennaRNA>=2.6"]
ml = ["torch>=2.2", "numpy>=1.26"]
# Wrapped published splice CNNs (inference only, out of the optimizer loop). The
# adapter drives the user's own install; the GPL `pangolin` package + weights are
# NOT bundled and must be installed separately from
# https://github.com/tkzeng/Pangolin (GPL-3.0). This extra pins only the runtime
# BT4 imports directly (PyTorch); see bt4.biomodels.splice.pangolin.
splice-pangolin = ["torch>=2.2"]
# SpliceAI (Illumina) is even more restrictive: code is PolyForm Strict 1.0.0 and
# weights are CC BY-NC 4.0 (noncommercial). NOT bundled; install the `spliceai`
# package separately (it ships the weights). This extra pins only TensorFlow (the
# runtime BT4 loads the Keras models with); see bt4.biomodels.splice.spliceai.
splice-spliceai = ["tensorflow>=2.6"]
app = ["PySide6>=6.7", "pyqtgraph>=0.13"]         # BT4 Studio native desktop app
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]  # optional headless HTTP API (+ test client)
assp = ["httpx>=0.27"]                            # opt-in online ASSP cross-check
packaging = ["pyinstaller>=6.0"]                  # build standalone BT4 Studio bundles
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[project.scripts]
bt4 = "bt4.cli.__main__:main"
bt4-studio = "bt4.app.__main__:main"

[project.urls]
Homepage = "https://github.com/masonberger4/BT4"

[tool.hatch.version]
path = "src/bt4/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bt4"]
# hatchling includes every file under the package directory (not only .py), so
# the typing marker (py.typed) and the data-driven codon tables (TSV + provenance
# sidecars) reach the wheel automatically. A previous force-include of the same
# paths double-added them and broke `pip install .` / wheel builds ("a second
# file is being added to the wheel archive at the same path"); the artifacts
# below keep the non-.py data files in the sdist as well.
artifacts = [
  "src/bt4/py.typed",
  "src/bt4/biomodels/codon/data/*.tsv",
  "src/bt4/biomodels/codon/data/*.provenance.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bt4"]
mypy_path = "src"
# The BT4 Studio app layer (bt4.app) is PySide6/Qt UI code. Qt's dynamic
# signal/slot machinery does not type-check cleanly under --strict without heavy
# scaffolding, and the app is deliberately kept out of the pure engine's strict
# gate (it is covered instead by ruff and an offscreen smoke test). The optional
# FastAPI service layer (bt4.service) is excluded on the same basis (dynamic
# FastAPI decorators vs --strict); it stays ruff-linted and HTTP-smoke-tested.
# Both call only bt4.api -- the engine behind that surface stays fully strict.
exclude = ['(^|/)bt4/app/', '(^|/)bt4/service/']

[[tool.mypy.overrides]]
module = ["PySide6.*", "pyqtgraph.*", "fastapi.*", "pydantic.*", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bt4"]
branch = true
