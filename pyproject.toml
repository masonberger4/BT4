[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bt4"
description = "Constrained, multi-objective protein to mRNA back-translation optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BT4 authors" }]
keywords = ["bioinformatics", "codon-optimization", "back-translation", "mRNA", "CAI"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = []  # the pure core is stdlib-only; heavy deps live behind extras

[project.optional-dependencies]
# Each heavy dependency is opt-in; `import bt4` must stay lightweight.
ilp = ["ortools>=9.10"]
fold = ["ViennaRNA>=2.6"]
ml = ["torch>=2.2", "numpy>=1.26"]
app = ["PySide6>=6.7", "pyqtgraph>=0.13"]         # BT4 Studio native desktop app
service = ["fastapi>=0.110", "uvicorn>=0.29"]     # optional headless HTTP API
assp = ["httpx>=0.27"]                            # opt-in online ASSP cross-check
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
]

[project.scripts]
bt4 = "bt4.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/masonberger4/BT4"

[tool.hatch.version]
path = "src/bt4/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bt4"]
# hatchling ships only .py by default; force-include the typing marker and the
# data-driven codon tables (TSV + provenance sidecars) so they reach the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/bt4/py.typed" = "bt4/py.typed"
"src/bt4/biomodels/codon/data" = "bt4/biomodels/codon/data"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bt4"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bt4"]
branch = true
