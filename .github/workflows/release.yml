name: Release

# On a version tag (e.g. v0.1.0) build the Python sdist + wheel and a standalone
# BT4 Studio desktop bundle for Linux / macOS / Windows, then publish them all as
# assets on a GitHub Release.
#
# `workflow_dispatch` can do two things:
#   * with no `ref`  -> build the dispatched branch's artifacts WITHOUT publishing
#     (a smoke test of the packaging), and
#   * with `ref` set to an existing tag (e.g. v0.2.0) -> rebuild THAT TAG's source
#     and idempotently attach the bundles to its release. This is the honest,
#     non-destructive way to repair a release that has no assets (for example one
#     created in the UI before this pipeline existed, or a run whose publish step
#     failed): it checks out the exact tagged source, so the bundles match the
#     version they are published under.
#
# Note: GitHub only exposes `workflow_dispatch` once this workflow file exists on
# the repository's DEFAULT branch. Until then, the tag-push trigger is the only
# way this workflow runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag to rebuild and attach bundles to (e.g. v0.2.0). Leave blank to build the dispatched branch without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dist:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push -> checkout uses the triggering tag. Set on a
          # dispatch -> build that exact tag's source.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  bundle:
    name: BT4 Studio bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bt4-studio-linux
          - os: macos-latest
            artifact: bt4-studio-macos
          - os: windows-latest
            artifact: bt4-studio-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install (app + packaging)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,packaging]'
      - name: Build the bundle
        working-directory: packaging
        run: pyinstaller --clean --noconfirm bt4-studio.spec
      - name: Archive the bundle
        shell: bash
        working-directory: packaging/dist
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            target="BT4 Studio.app"
          else
            target="BT4 Studio"
          fi
          out="${{ github.workspace }}/${{ matrix.artifact }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$out" "$target"
          else
            zip -r "$out" "$target"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish GitHub Release
    # Publish on a tag push, or on a manual dispatch that names an existing tag to
    # repair. A dispatch with no `ref` just builds artifacts and stops here.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
    needs: [dist, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag to publish under: the dispatched tag, else the pushed tag.
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          assets=$(find artifacts -type f \( -name '*.zip' -o -name '*.whl' -o -name '*.tar.gz' \))
          # Fail loudly rather than publish an empty release: an asset-less release
          # is exactly the broken state this pipeline exists to avoid.
          if [ -z "$assets" ]; then
            echo "::error::no build artifacts found to attach to ${TAG}"
            exit 1
          fi
          # Idempotent: if the release already exists (e.g. created in the UI, which
          # also creates the tag that triggered this run, or a prior asset-less
          # release being repaired), upload assets to it instead of failing on
          # "release already exists".
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" $assets --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              $assets
          fi
