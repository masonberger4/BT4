name: Release

# On a version tag (e.g. v0.1.0) build the Python sdist + wheel and a standalone,
# double-clickable BT4 Studio app for each OS, then publish them all as assets on
# a GitHub Release. The per-OS artifacts are chosen so a non-technical user can
# just download one thing and open it:
#
#   * Windows -> BT4-Studio-Windows.exe        (one-file, double-click)
#   * macOS   -> BT4-Studio-macOS.dmg          (drag to Applications)
#   * Linux   -> BT4-Studio-Linux-x86_64       (one-file, mark executable + run)
#
# `workflow_dispatch` can do two things:
#   * with no `ref`  -> build the dispatched branch's artifacts WITHOUT publishing
#     (a smoke test of the packaging), and
#   * with `ref` set to an existing tag (e.g. v0.2.0) -> rebuild THAT TAG's source
#     and idempotently attach the assets to its release. This is the honest,
#     non-destructive way to repair a release that has no assets: it checks out
#     the exact tagged source, so the app matches the version it is published
#     under.
#
# Note: GitHub only exposes `workflow_dispatch` once this workflow file exists on
# the repository's DEFAULT branch. Until then, the tag-push trigger is the only
# way this workflow runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag to rebuild and attach assets to (e.g. v0.2.0). Leave blank to build the dispatched branch without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dist:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a tag push -> checkout uses the triggering tag. Set on a
          # dispatch -> build that exact tag's source.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version inside the package
        # A tag is just a label a human types, and nothing else compares it to
        # `bt4.__version__` -- so `git tag v0.5.1` on a tree that still says 0.5.0
        # publishes assets whose filenames, release page and `bt4 --version` disagree,
        # and the manifest inside every result stamps the wrong one. Cheap to check,
        # impossible to fix after the fact without deleting a published release.
        # Skipped on a dispatch with no `ref` (that build publishes nothing).
        if: startsWith(github.ref, 'refs/tags/') || inputs.ref != ''
        shell: bash
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          version=$(grep -oP '^__version__ = "\K[^"]+' src/bt4/__init__.py)
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match __version__ ${version} (expected v${version})"
            exit 1
          fi
          echo "tag ${TAG} matches __version__ ${version}"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  bundle:
    name: BT4 Studio app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bt4-studio-linux
            asset: BT4-Studio-Linux-x86_64
          - os: macos-latest
            artifact: bt4-studio-macos
            asset: BT4-Studio-macOS.dmg
          - os: windows-latest
            artifact: bt4-studio-windows
            asset: BT4-Studio-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt libraries (Linux)
        if: runner.os == 'Linux'
        # PyInstaller embeds the shared libraries it finds ON THE BUILD MACHINE, so
        # this list decides what the SHIPPED binary contains -- it is not just build
        # scaffolding. With only the five libraries this step used to install, the
        # bundle came out missing every `libxcb-*` the Qt `xcb` platform plugin needs,
        # and the published app aborted on any machine that did not happen to have
        # them with "Could not load the Qt platform plugin xcb" and nothing else.
        # Installing the full set makes the one-file download genuinely standalone:
        # measured, a bundle built this way still launches and designs after all of
        # these packages are REMOVED from the machine running it, because it carries
        # its own copies. What it then needs from the system is only base graphics
        # (libc, libEGL/libGL, libdrm, libxcb1), which any desktop already has.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-glx0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxi6 libxrender1
      - name: Install (app + packaging)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,packaging]'
      - name: Build the app
        working-directory: packaging
        run: pyinstaller --clean --noconfirm bt4-studio.spec
      - name: Smoke-launch the built app (offscreen)
        # Actually OPEN the freshly built bundle and DESIGN with it. --self-test
        # builds StudioWindow (the bundled codon data, the Qt/pyqtgraph stack) and
        # then runs two real solves through bt4.api, requiring a restriction rule to
        # change the delivered sequence -- so it fails both on a bundle that cannot
        # open and on one that opens and cannot work. It exits 0 without entering the
        # event loop. Since v0.5.0 the same check also runs per-OS in ci.yml on every
        # PR, so a broken bundle fails before a tag is pushed rather than after; this
        # step remains the last gate on the exact artifact being published.
        timeout-minutes: 3
        shell: bash
        working-directory: packaging/dist
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "${{ runner.os }}" in
            Windows) "./BT4 Studio.exe" --self-test ;;
            macOS)   "./BT4 Studio.app/Contents/MacOS/BT4 Studio" --self-test ;;
            Linux)   "./BT4 Studio" --self-test ;;
          esac
      - name: Package the double-clickable asset
        shell: bash
        working-directory: packaging/dist
        run: |
          case "${{ runner.os }}" in
            Windows)
              # PyInstaller emits a single "BT4 Studio.exe"; give it a friendly name.
              mv "BT4 Studio.exe" "${{ matrix.asset }}"
              ;;
            macOS)
              # Wrap the .app in a compressed, drag-to-Applications .dmg.
              mkdir dmgroot
              cp -R "BT4 Studio.app" dmgroot/
              ln -s /Applications dmgroot/Applications
              hdiutil create -volname "BT4 Studio" -srcfolder dmgroot -ov \
                -format UDZO "${{ matrix.asset }}"
              ;;
            Linux)
              # PyInstaller emits a single "BT4 Studio" executable; friendly name.
              mv "BT4 Studio" "${{ matrix.asset }}"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Rename happens inside packaging/dist (avoids the fragile cross-shell
          # ${GITHUB_WORKSPACE} absolute path on the Windows git-bash runner).
          path: packaging/dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    # Publish on a tag push, or on a manual dispatch that names an existing tag to
    # repair. A dispatch with no `ref` just builds artifacts and stops here.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
    needs: [dist, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag to publish under: the dispatched tag, else the pushed tag.
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          assets=$(find artifacts -type f \( -name 'BT4-Studio-*' -o -name '*.whl' -o -name '*.tar.gz' \))
          # Fail loudly rather than publish an empty release: an asset-less release
          # is exactly the broken state this pipeline exists to avoid.
          if [ -z "$assets" ]; then
            echo "::error::no build artifacts found to attach to ${TAG}"
            exit 1
          fi
          # Idempotent: if the release already exists (e.g. created in the UI, which
          # also creates the tag that triggered this run, or a prior asset-less
          # release being repaired), upload assets to it instead of failing on
          # "release already exists".
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; uploading assets"
            gh release upload "${TAG}" $assets --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              $assets
          fi
