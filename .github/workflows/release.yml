name: Release

# On a version tag (e.g. v0.1.0) build the Python sdist + wheel and a standalone
# BT4 Studio desktop bundle for Linux / macOS / Windows, then publish them all as
# assets on a GitHub Release. `workflow_dispatch` builds the same artifacts for
# testing without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/*

  bundle:
    name: BT4 Studio bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bt4-studio-linux
          - os: macos-latest
            artifact: bt4-studio-macos
          - os: windows-latest
            artifact: bt4-studio-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install (app + packaging)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,packaging]'
      - name: Build the bundle
        working-directory: packaging
        run: pyinstaller --clean --noconfirm bt4-studio.spec
      - name: Archive the bundle
        shell: bash
        working-directory: packaging/dist
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            target="BT4 Studio.app"
          else
            target="BT4 Studio"
          fi
          out="${{ github.workspace }}/${{ matrix.artifact }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$out" "$target"
          else
            zip -r "$out" "$target"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [dist, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(find artifacts -type f \( -name '*.zip' -o -name '*.whl' -o -name '*.tar.gz' \))
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $assets
