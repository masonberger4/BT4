name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow a run to be started manually from the Actions tab (or the API). This is a
  # safety valve: if a branch's PR check suite gets into a state where the
  # pull_request event does not spawn a run (e.g. after the branch is deleted and
  # recreated), CI can still be dispatched on demand rather than left with no run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never cancel a run on main: every
  # merged commit deserves a full, uncancelled CI validation (a mid-run cancel
  # leaves main without a green check even though nothing failed).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Import layering contract
        run: lint-imports
      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Same input => byte-identical output
        run: pytest tests -k determinism -q

  native:
    # Builds the optional Rust/PyO3 accelerator and runs the suite with it
    # active, so the accelerator-vs-pure-Python equivalence test exercises Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install (core + dev + maturin)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' maturin
      - name: Build & install the bt4_native accelerator
        run: |
          maturin build --release --manifest-path rust/bt4_core/Cargo.toml
          pip install --force-reinstall --no-deps rust/bt4_core/target/wheels/bt4_native-*.whl
      - name: Tests with the Rust path active
        run: |
          python -c "import bt4._accel as a; assert a.ACCELERATED, 'native ext not loaded'"
          pytest -q

  app:
    # Builds and tests BT4 Studio (the PySide6 desktop app) headless, driving Qt
    # through the offscreen platform plugin. The app is an in-tree, tested surface
    # (the lesson from BT3's stranded `streamlit` branch), not a side project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install (core + app + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,dev]'
      - name: Ruff (app layer)
        run: ruff check src/bt4/app
      - name: Layering contract (app in scope)
        run: lint-imports
      - name: App smoke test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_app_smoke.py -q

  service:
    # Builds and tests the optional headless HTTP API (bt4.service, FastAPI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + service + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[service,dev]'
      - name: Ruff (service layer)
        run: ruff check src/bt4/service
      - name: Layering contract (service in scope)
        run: lint-imports
      - name: Service HTTP smoke test
        run: pytest tests/test_service.py -q

  ilp:
    # Builds and tests the optional OR-Tools CP-SAT solver backend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + ilp + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ilp,dev]'
      - name: Ruff (cpsat backend)
        run: ruff check src/bt4/optimize/cpsat.py
      - name: CP-SAT backend tests
        run: pytest tests/test_cpsat.py -q
