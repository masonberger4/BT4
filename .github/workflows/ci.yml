name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow a run to be started manually from the Actions tab (or the API). This is a
  # safety valve: if a branch's PR check suite gets into a state where the
  # pull_request event does not spawn a run (e.g. after the branch is deleted and
  # recreated), CI can still be dispatched on demand rather than left with no run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never cancel a run on main: every
  # merged commit deserves a full, uncancelled CI validation (a mid-run cancel
  # leaves main without a green check even though nothing failed).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job sets `timeout-minutes`. GitHub's default is 6 HOURS, and a job that
# hangs rather than fails burns all of it while holding a required check pending --
# which blocks a PR's auto-merge for the duration. That is not hypothetical here:
# the `app` job once sat 35+ minutes on `apt-get install` (a step that takes 9
# seconds when healthy) before any test body ran, and would have sat there until
# the 6-hour cap. A hang must fail fast and say so.
#
# The values are set from measured durations on a green run of `main`, at roughly
# 3-15x the observed time -- generous enough that a slow runner or a cold cache
# never trips one (a timeout that fires on healthy work is worse than the hang it
# guards), tight enough that a wedged job is a CI failure within minutes:
#
#   determinism 21s | service 23s | ilp 31s | app 53s | native 77s
#   quality 3m46s (3.13) .. 5m49s (3.10)
jobs:
  quality:
    # The slowest job -- the full suite plus coverage, four Python versions.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Import layering contract
        run: lint-imports
      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing

  determinism:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Same input => byte-identical output
        run: pytest tests -k determinism -q

  native:
    # Builds the optional Rust/PyO3 accelerator and runs the suite with it
    # active, so the accelerator-vs-pure-Python equivalence test exercises Rust.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install (core + dev + maturin)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' maturin
      - name: Build & install the bt4_native accelerator
        run: |
          maturin build --release --manifest-path rust/bt4_core/Cargo.toml
          pip install --force-reinstall --no-deps rust/bt4_core/target/wheels/bt4_native-*.whl
      - name: Tests with the Rust path active
        run: |
          python -c "import bt4._accel as a; assert a.ACCELERATED, 'native ext not loaded'"
          pytest -q

  app:
    # Builds and tests BT4 Studio (the PySide6 desktop app) headless, driving Qt
    # through the offscreen platform plugin. The app is an in-tree, tested surface
    # (the lesson from BT3's stranded `streamlit` branch), not a side project.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt runtime libraries (headless)
        # Tighter than the job's own budget because this is the step that wedged,
        # and it is the only network-dependent step here with a sub-10-second
        # healthy time -- so minutes of it is already a fault, not slowness.
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install (core + app + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,dev]'
      - name: Ruff (app layer)
        run: ruff check src/bt4/app
      - name: Layering contract (app in scope)
        run: lint-imports
      - name: App smoke test (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_app_smoke.py -q

  service:
    # Builds and tests the optional headless HTTP API (bt4.service, FastAPI).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + service + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[service,dev]'
      - name: Ruff (service layer)
        run: ruff check src/bt4/service
      - name: Layering contract (service in scope)
        run: lint-imports
      - name: Service HTTP smoke test
        run: pytest tests/test_service.py -q

  ilp:
    # Builds and tests the optional OR-Tools CP-SAT solver backend.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + ilp + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[ilp,dev]'
      - name: Ruff (cpsat backend)
        run: ruff check src/bt4/optimize/cpsat.py
      - name: CP-SAT backend tests
        run: pytest tests/test_cpsat.py -q

  bundle:
    # Builds the PyInstaller bundle on all three OSes and OPENS it. This is the only
    # job that exercises the artifact users actually download, and it exists because
    # the v0.5.0 release found the packaged app dead on arrival while every job above
    # stayed green: `bt4-studio.spec` collected `**/*.provenance.json`, so RiboNN's
    # weight-hash pin (read at import time, on a path `bt4.api` imports) was simply
    # absent from the bundle. `tests/test_bundle_spec.py` now pins the spec's data
    # coverage cheaply, in `quality` -- but only freezing the app and launching it
    # covers the rest of the class: a missed hidden import, a Qt plugin that does not
    # survive the freeze, a macOS `.app` layout difference.
    #
    # Until now that check ran only in `release.yml`, i.e. AFTER the tag was pushed --
    # the worst possible moment to learn the bundle is broken. Same steps as that
    # workflow's `bundle` job, minus the asset packaging and publishing.
    name: Packaged app (${{ matrix.os }})
    # ~4-6 minutes observed per OS (a local Linux build is ~65s; hosted runners are
    # slower and macOS/Windows slower still), so this is the 3-5x rule the header
    # describes, not a loose cap.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # PyInstaller embeds the shared libraries it finds ON THE BUILD MACHINE, so
        # this list decides what the SHIPPED binary contains -- it is not just build
        # scaffolding. With only the five libraries this step used to install, the
        # bundle came out missing every `libxcb-*` the Qt `xcb` platform plugin needs,
        # and the published app aborted on any machine that did not happen to have
        # them with "Could not load the Qt platform plugin xcb" and nothing else.
        # Installing the full set makes the one-file download genuinely standalone:
        # measured, a bundle built this way still launches and designs after all of
        # these packages are REMOVED from the machine running it, because it carries
        # its own copies. What it then needs from the system is only base graphics
        # (libc, libEGL/libGL, libdrm, libxcb1), which any desktop already has.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-glx0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxi6 libxrender1
      - name: Install (core + app + packaging)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[app,packaging]'
      - name: Build the bundle
        working-directory: packaging
        run: pyinstaller --clean --noconfirm bt4-studio.spec
      - name: Open the built bundle and design a sequence (offscreen)
        # `--self-test` constructs StudioWindow AND runs one real design through
        # bt4.api inside the frozen bundle, so this fails on a bundle that cannot
        # open *or* one that opens and cannot work. Tighter than the job budget: the
        # healthy run is seconds, so minutes of it is a wedge, not slowness.
        timeout-minutes: 5
        shell: bash
        working-directory: packaging/dist
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "${{ runner.os }}" in
            Windows) "./BT4 Studio.exe" --self-test ;;
            macOS)   "./BT4 Studio.app/Contents/MacOS/BT4 Studio" --self-test ;;
            Linux)   "./BT4 Studio" --self-test ;;
          esac
